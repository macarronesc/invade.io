name: Website and documentation

on:
  push:
    branches: [dev, main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'assets/brand/**'
      - 'assets/fonts/Fredoka.ttf'
      - 'assets/fonts/LICENSE-OFL.txt'
      - 'assets/legal/notices.txt'
      - 'icon.svg'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'addons/**'
      - 'assets/**'
      - 'locale/**'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pages-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked website dependencies
        run: npm ci
      - name: Check canonical content and build the public website
        run: |
          npm test
          npm run build
      - name: Check real browser journeys and accessibility
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Export the browser demo into the site
        working-directory: .
        run: |
          cd "$RUNNER_TEMP"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          curl --fail --location --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  godot.zip' | sha512sum --check -
          echo 'ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  templates.tpz' | sha512sum --check -
          unzip -q godot.zip
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$templates"
          cd "$GITHUB_WORKSPACE"
          godot="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$godot"
          "$godot" --headless --path . --editor --import
          mkdir -p website/dist/play/game
          "$godot" --headless --path . --export-release Web "$PWD/website/dist/play/game/index.html"
          test -s website/dist/play/game/index.wasm && test -s website/dist/play/game/index.pck
          rm -f "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"
      - name: Package only the checked static output
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT" == pull_request && "$BASE_REF" == dev ]]; then
            tar -C dist -cf "$RUNNER_TEMP/artifact.tar" --transform='s,^,invade.io/,' .
          else
            tar -C dist -cf "$RUNNER_TEMP/artifact.tar" .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && format('website-preview-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && 7 || 1 }}
          if-no-files-found: error
  pages-deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
