[preset.2]

name="Android AAB"
platform="Android"
runnable=false
advanced_options=true
custom_features="aptabase_release"
export_filter="all_resources"
include_filter="assets/data/*.json,assets/legal/*.txt"
exclude_filter="scenes/tests/*,scripts/tests/*,build/*,tools/*,docs/*,*.keystore,*.jks,*.p12,*.p8,*.pem,*.key,*.pfx,*.b64,*.mobileprovision,*.provisionprofile,export_credentials.cfg"
export_path="build/android/invadeio.aab"

[preset.2.options]

; Paquete para Google Play: formato AAB, sólo arm64-v8a (64 bits obligatorio) y sin
; comprimir las librerías nativas (16 KB de alineación, ver docs/PLAY_STORE.md).
; La firma se toma de GODOT_ANDROID_KEYSTORE_RELEASE_* : ninguna clave vive en el repositorio.
gradle_build/use_gradle_build=true
gradle_build/export_format=1
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="macarronesc.invadeio"
package/name="invade.io"
version/code=5
version/name="0.3.1"
permissions/vibrate=true
permissions/internet=true
permissions/access_network_state=true
launcher_icons/main_192x192="res://assets/brand/icon-192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/brand/adaptive-foreground-432.png"
launcher_icons/adaptive_background_432x432="res://assets/brand/adaptive-background-432.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/brand/adaptive-monochrome-432.png"
