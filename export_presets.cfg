[preset.0]

name="iOS"
platform="iOS"
runnable=false
advanced_options=true
export_filter="all_resources"
include_filter="assets/data/*.json,assets/legal/*.txt"
exclude_filter="scenes/tests/*,scripts/tests/*,build/*,tools/*,docs/*,*.keystore,*.jks,*.p12,*.p8,*.pem,*.key,*.pfx,*.b64,*.mobileprovision,*.provisionprofile,export_credentials.cfg"
export_path="build/ios/invadeio.xcodeproj"

[preset.0.options]

architectures/arm64=true
; Marcador para exportar sin credenciales. SideStore aplica la firma real al instalar.
application/app_store_team_id="0000000000"
application/bundle_identifier="macarronesc.invadeio"
application/short_version="0.3.1"
application/version="1"
application/export_project_only=true
application/min_ios_version="15.0"
plugins/BackupFilePicker=true
entitlements/game_center=false
privacy/file_timestamp_access_reasons=2
privacy/system_boot_time_access_reasons=1
privacy/disk_space_access_reasons=1
icons/icon_1024x1024="res://assets/brand/icon-1024.png"

